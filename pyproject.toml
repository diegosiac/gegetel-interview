[project]
name = "gegetel-benefits-api"
version = "0.1.0"
description = "Gege Tel practical case: lines, network webhook, benefits and grounded agent."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
